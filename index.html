<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary SEO -->
    <title>
      Nancy Gabriel | Digital Growth & Visibility Specialist
    </title>

    <meta
      name="description"
      content="Nancy Gabriel is a Digital Growth & Visibility Specialist helping brands grow online through SEO, website development, social media management, digital advertising, and creative content."
    />

    <meta
      name="keywords"
      content="Nancy Gabriel, Digital Growth and Visibility Specialist, SEO Specialist, SEO Strategist, Website Development, Social Media Management, Digital Advertising, Content Creation"
    />

    <meta name="author" content="Nancy Gabriel" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://www.nancygabriel.com/"
    />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Theme / Browser -->
    <meta name="theme-color" content="#ec4899" />
    <meta name="color-scheme" content="dark light" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.svg"
    />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Nancy Gabriel | Digital Growth & Visibility Specialist"
    />

    <meta
      property="og:description"
      content="Explore Nancy Gabriel's work across SEO, website development, social media management, digital advertising, and creative content."
    />

    <meta
      property="og:url"
      content="https://www.nancygabriel.com/"
    />

    <meta
      property="og:site_name"
      content="Nancy Gabriel"
    />

    <meta
      property="og:locale"
      content="en_US"
    />

    <!-- Replace with your actual social preview image -->
    <meta
      property="og:image"
      content="https://www.nancygabriel.com/og-image.jpg"
    />

    <meta
      property="og:image:alt"
      content="Nancy Gabriel — Digital Growth & Visibility Specialist"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Nancy Gabriel | Digital Growth & Visibility Specialist"
    />

    <meta
      name="twitter:description"
      content="Nancy Gabriel helps brands grow online through SEO, websites, social media, digital advertising, and creative content."
    />

    <meta
      name="twitter:image"
      content="https://www.nancygabriel.com/og-image.jpg"
    />

    <!-- Structured Data: Person -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Nancy Gabriel",
        "url": "https://www.nancygabriel.com/",
        "jobTitle": "Digital Growth & Visibility Specialist",
        "description": "Nancy Gabriel is a Digital Growth & Visibility Specialist helping brands grow online through SEO, website development, social media management, digital advertising, and creative content.",
        "knowsAbout": [
          "Search Engine Optimization",
          "SEO Strategy",
          "Website Development",
          "Social Media Management",
          "Digital Advertising",
          "Content Creation",
          "Video Editing",
          "Promotional Design",
          "Digital Growth"
        ],
        "sameAs": [
          "YOUR_LINKEDIN_URL",
          "YOUR_TWITTER_URL",
          "YOUR_YOUTUBE_URL"
        ]
      }
    </script>

    <!-- Structured Data: Website -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Nancy Gabriel",
        "alternateName": "Nancy Gabriel — Digital Growth & Visibility Specialist",
        "url": "https://www.nancygabriel.com/"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
